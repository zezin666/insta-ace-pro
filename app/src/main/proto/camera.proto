syntax = "proto3";

package insta360.messages;

option java_package = "com.acegallery.proto";
option java_outer_classname = "CameraProto";

enum MediaType {
  VIDEO = 0;
  PHOTO = 1;
  VIDEO_AND_PHOTO = 2;
  DNG = 3;
  MP4 = 4;
  JPG = 5;
  INS_DATA = 6;
}

message GetFileList {
  MediaType media_type = 1;
  uint32 start = 2;
  uint32 limit = 3;
}

message GetFileListResp {
  repeated string uri = 1;
  uint32 total_count = 2;
}

message GetFileExtra {
  string uri = 1;
  uint32 extra_type = 2;
}

message DeleteFiles {
  repeated string uri = 1;
}

message DeleteFilesResp {
  repeated string fail_uri = 1;
}

enum VideoResolution {
  UNKNOWN_RESOLUTION = 0;
  RES_1920_960P30 = 2;
  RES_1440_720P30 = 9;
  RES_1920_1080P30 = 29;
  RES_424_240P15 = 34;
  RES_1920_1080P60 = 40;
  RES_1280_720P30 = 43;
  RES_1280_960P30 = 44;
}

enum CaptureMode {
  CAPTURE_MODE_UNKNOWN = 0;
  CAPTURE_MODE_NORMAL = 1;
}

enum TakePictureMode {
  TAKE_PICTURE_NORMAL = 0;
  TAKE_PICTURE_AEB = 1;
  TAKE_PICTURE_BURST = 3;
  TAKE_PICTURE_AEB_NIGHT = 4;
}

message StartLiveStream {
  bool enable_audio = 1;
  bool enable_video = 2;
  uint32 audio_type = 3;
  uint32 audio_sample_rate = 4;
  uint32 audio_bitrate = 5;
  uint32 video_bitrate = 6;
  VideoResolution resolution = 7;
  bool enable_gyro = 8;
  uint32 video_bitrate1 = 9;
  VideoResolution resolution1 = 10;
  uint32 preview_stream_num = 11;
  bool enable_rotate = 12;
  bool is_for_live = 13;
}

message StartLiveStreamResp {}

message StartCapture {
  CaptureMode mode = 1;
}

message StartCaptureResp {}

message StopCapture {
  CaptureMode mode = 2;
}

message StopCaptureResp {}

message TakePicture {
  TakePictureMode mode = 1;
}

message TakePictureResponse {}

enum SyncCaptureMode {
  SYNC_MODE_UNKNOWN = 0;
  SYNC_MODE_NORMAL_IMAGE = 1;
  SYNC_MODE_NORMAL_VIDEO = 2;
  SYNC_MODE_HDR_IMAGE = 3;
  SYNC_MODE_HDR_VIDEO = 4;
  SYNC_MODE_INTERVAL_IMAGE = 5;
  SYNC_MODE_TIMELAPSE_VIDEO = 6;
  SYNC_MODE_BURST_PHOTO = 7;
  SYNC_MODE_BULLETTIME_VIDEO = 8;
  SYNC_MODE_TIMESHIFT_VIDEO = 9;
  SYNC_MODE_AEB_NIGHT_PHOTO = 10;
}

message SetSyncCaptureMode { SyncCaptureMode capture_mode = 1; }
message SetSyncCaptureModeResp {}
message GetSyncCaptureMode {}
message GetSyncCaptureModeResp { SyncCaptureMode capture_mode = 1; }

message WindowCropInfo {
  uint32 src_width = 1;
  uint32 src_height = 2;
  uint32 dst_width = 3;
  uint32 dst_height = 4;
  int32 crop_offset_x = 5;
  int32 crop_offset_y = 6;
}

message LiveStreamParamsUpdate {
  uint32 res_width = 2;
  uint32 res_height = 3;
  uint32 res_fps = 4;
  WindowCropInfo window_crop_info = 6;
  WindowCropInfo half_window_crop_info = 7;
}

message NotificationSyncCaptureModeUpdate {}
